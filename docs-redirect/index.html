<!doctype html>
<meta charset="utf-8">
<title>Documentation has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://docs.cognipeer.com/graph-builder/">
<script>
(function () {
  var base = "/graph-builder/";
  var path = location.pathname;
  var p = path.indexOf(base) === 0 ? path.slice(base.length) : "";
  p = p.replace(/^\/+/, "").replace(/\.html$/, "");
  var target = /^changelog/.test(p) ? 'release-notes/graph-builder/' : 'graph-builder/' + p;
  location.replace("https://docs.cognipeer.com/" + target + location.hash);
})();
</script>
<p>This documentation now lives at <a href="https://docs.cognipeer.com/graph-builder/">docs.cognipeer.com</a>.</p>
